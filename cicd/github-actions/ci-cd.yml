name: ForgeFlow CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'release/**' ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ─────────────────────────────────────────
  # Job 1: Code Quality with SonarQube
  # ─────────────────────────────────────────
  code-quality:
    name: 🔍 Code Quality (SonarQube)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Shallow clones disabled for better analysis

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build and analyze with SonarQube
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn -B verify sonar:sonar
              -Dsonar.projectKey=${{ github.event.repository.name }}
              -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
              -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  # ─────────────────────────────────────────
  # Job 2: Build & Push Docker Image
  # ─────────────────────────────────────────
  build-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: code-quality
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

  # ─────────────────────────────────────────
  # Job 3: Trivy Security Scan
  # ─────────────────────────────────────────
  security-scan:
    name: 🛡️ Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload Trivy JSON report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}'
          format: 'json'
          output: 'trivy-report.json'

      - name: Report to ForgeFlow IDP
        if: always()
        run: |
          CRITICAL=$(jq '[.Results[].Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL")] | length' trivy-report.json)
          HIGH=$(jq '[.Results[].Vulnerabilities // [] | .[] | select(.Severity == "HIGH")] | length' trivy-report.json)
          curl -s -X PATCH "${{ secrets.FORGEFLOW_API_URL }}/api/pipelines/${{ github.run_number }}" \
            -H "Authorization: Bearer ${{ secrets.FORGEFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"trivyStatus\":\"$([ $CRITICAL -eq 0 ] && echo PASSED || echo FAILED)\",\"trivyCriticalCount\":$CRITICAL,\"trivyHighCount\":$HIGH}"

  # ─────────────────────────────────────────
  # Job 4: GitOps Deployment via ArgoCD
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy via ArgoCD (GitOps)
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://${{ github.event.repository.name }}.forgeflow.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Update Helm values with new image tag
        run: |
          sed -i "s|tag: .*|tag: \"${{ env.IMAGE_TAG }}\"|" helm/${{ github.event.repository.name }}/values.yaml
          git config user.email "forgeflow-bot@forgeflow.io"
          git config user.name "ForgeFlow Bot"
          git add helm/${{ github.event.repository.name }}/values.yaml
          git commit -m "chore(deploy): update ${{ github.event.repository.name }} to ${{ env.IMAGE_TAG }} [skip ci]"
          git push

      - name: Sync ArgoCD Application
        run: |
          argocd app sync ${{ github.event.repository.name }} \
            --server ${{ secrets.ARGOCD_SERVER }} \
            --auth-token ${{ secrets.ARGOCD_TOKEN }} \
            --insecure --prune
          argocd app wait ${{ github.event.repository.name }} \
            --server ${{ secrets.ARGOCD_SERVER }} \
            --auth-token ${{ secrets.ARGOCD_TOKEN }} \
            --health --timeout 300

      - name: Notify ForgeFlow IDP
        if: always()
        run: |
          curl -s -X PATCH "${{ secrets.FORGEFLOW_API_URL }}/api/deployments/latest" \
            -H "Authorization: Bearer ${{ secrets.FORGEFLOW_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"${{ job.status == 'success' && 'RUNNING' || 'FAILED' }}\",\"imageTag\":\"${{ env.IMAGE_TAG }}\"}"
