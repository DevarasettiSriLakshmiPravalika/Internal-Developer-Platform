apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  labels:
    app: {{ .Values.appName }}
    managed-by: forgeflow
spec:
  tls:
    - hosts:
        - {{ .Values.appName }}.forgeflow.io
      secretName: {{ .Values.appName }}-tls
  rules:
    - host: {{ .Values.appName }}.forgeflow.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.appName }}
                port:
                  number: 80
