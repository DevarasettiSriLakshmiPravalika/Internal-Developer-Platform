[SERVICE]
    Daemon       Off
    Log_Level    Info
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/*.log
    multiline.parser  docker, cri
    DB                /var/log/flb_kube.db
    Skip_Long_Lines   On
    Refresh_Interval  10

[INPUT]
    Name   systemd
    Tag    host.*
    Systemd_Filter  _SYSTEMD_UNIT=kubelet.service
    Read_From_Tail  On

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
    Kube_Tag_Prefix     kube.var.log.containers.
    Merge_Log           On
    Merge_Log_Key       log_processed
    K8S-Logging.Parser  On
    K8S-Logging.Exclude Off

[FILTER]
    Name    grep
    Match   kube.*
    Regex   kubernetes_namespace_name ^(default|production|staging)$

[OUTPUT]
    Name            loki
    Match           kube.*
    Host            loki
    Port            3100
    Labels          job=fluentbit, cluster=forgeflow, namespace=$kubernetes_namespace_name, pod=$kubernetes_pod_name, container=$kubernetes_container_name
    Label_Keys      $kubernetes_namespace_name,$kubernetes_pod_name,$kubernetes_container_name
    Remove_Keys     kubernetes,docker_id,stream,logtag
    Line_Format     json
    Auto_Kubernetes_Labels on
